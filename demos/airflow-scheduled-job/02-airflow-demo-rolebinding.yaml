---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-demo-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-demo-spark
subjects:
- kind: ServiceAccount
  name: airflow-serviceaccount
  namespace: {{ NAMESPACE }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-demo-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-demo-setup
subjects:
- kind: ServiceAccount
  name: demo-serviceaccount
  namespace: {{ NAMESPACE }}
