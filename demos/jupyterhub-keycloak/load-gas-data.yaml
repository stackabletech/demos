---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-gas-data
spec:
  template:
    spec:
      containers:
        - name: load-gas-data
          image: docker.io/rclone/rclone:1.75.1
          args:
            - copyurl
            - https://repo.stackable.tech/repository/misc/datasets/gas-sensor-data/20160930_203718.csv
            - :s3:demo/gas-sensor/raw/20160930_203718.csv
          env:
            # No config file, everything is configured through the environment.
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_S3_PROVIDER
              value: Other
            - name: RCLONE_S3_ENDPOINT
              value: https://garage.{{ NAMESPACE }}.svc.cluster.local:9000
            # Garage rejects requests signed for a different region.
            - name: RCLONE_S3_REGION
              value: region-1
            # Garage only serves path style, not virtual-hosted style.
            - name: RCLONE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CA_CERT
              value: /stackable/tls/ca.crt
            # Buckets are created by the Garage init job. Without this rclone
            # creates a missing bucket on the fly, which turns a typo into a
            # silent success instead of an error.
            - name: RCLONE_S3_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: accessKey
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secretKey
          volumeMounts:
            - name: tls
              mountPath: /stackable/tls
      volumes:
        - name: tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: tls
                  secrets.stackable.tech/scope: service=garage,pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: "1"
      restartPolicy: OnFailure
  backoffLimit: 50
