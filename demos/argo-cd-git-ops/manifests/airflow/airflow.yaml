---
apiVersion: airflow.stackable.tech/v1alpha1
kind: AirflowCluster
metadata:
  name: airflow
  labels:
    stackable.tech/vendor: Stackable
    stackable.tech/demo: argo-cd-git-ops
spec:
  image:
    productVersion: 3.3.2
    pullPolicy: IfNotPresent
  clusterConfig:
    loadExamples: false
    exposeConfig: false
    metadataDatabase:
      postgresql:
        host: postgresql-airflow
        database: airflow
        credentialsSecretName: airflow-postgresql-credentials
    credentialsSecretName: airflow-admin-credentials
    # NOTE: This cannot be parameterized via stackablectl since it is synced via ArgoCD.
    #
    # In terms of forking the repository, this should not be a problem since the DAGs are the same.
    # You can still change this locally and point to the fork in case of any changes to DAGs.
    #
    # TODO(@maltesander): In a Stackable release, this branch should point to the release-YY.MM branch!
    dagsGitSync:
      - repo: https://github.com/stackabletech/demos/
        branch: main
        gitFolder: "demos/argo-cd-git-ops/dags"
        depth: 2
    volumes:
      # Only the CA is needed, to verify the Garage S3 endpoint.
      - name: s3-tls
        ephemeral:
          volumeClaimTemplate:
            metadata:
              annotations:
                secrets.stackable.tech/class: tls
                secrets.stackable.tech/scope: pod
                secrets.stackable.tech/provision-parts: public
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: "1"
              storageClassName: secrets.stackable.tech
    volumeMounts:
      - name: s3-tls
        mountPath: /stackable/s3-tls
  webservers:
    roleConfig:
      listenerClass: external-stable
    envOverrides: &envOverrides
      AIRFLOW_CONN_KUBERNETES_IN_CLUSTER: "kubernetes://?__extra__=%7B%22extra__kubernetes__in_cluster%22%3A+true%2C+%22extra__kubernetes__kube_config%22%3A+%22%22%2C+%22extra__kubernetes__kube_config_path%22%3A+%22%22%2C+%22extra__kubernetes__namespace%22%3A+%22%22%7D"
      # Via sealed secrets and pod overrides, just kept for reference here
      # AIRFLOW_CONN_S3: "aws://GK31c0ffee31c0ffee31c0ffee:<secretKey>@/?endpoint_url=https%3A%2F%2Fgarage.garage.svc.cluster.local%3A9000"
      AWS_CA_BUNDLE: "/stackable/s3-tls/ca.crt"
      # boto3 has no region here otherwise, and Garage rejects requests signed
      # for a different region than the one it is configured with.
      AWS_DEFAULT_REGION: region-1
      AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://demo/airflow-task-logs/
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: s3
      # 20 seconds to reload the DAGS folder (default: 300)
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "20"
    podOverrides: &podOverrides
      spec:
        containers:
          - name: airflow
            env:
              - name: AIRFLOW_CONN_S3
                valueFrom:
                  secretKeyRef:
                    name: airflow-s3-connection
                    key: airflow-s3-connection
          - name: git-sync-0
            resources:
              limits:
                memory: "128Mi"
              requests:
                memory: "128Mi"
        initContainers:
          - name: git-sync-0-init
            resources:
              limits:
                memory: "128Mi"
              requests:
                memory: "128Mi"
    config:
      gracefulShutdownTimeout: 30s
      resources:
        cpu:
          min: 400m
          max: "1"
        memory:
          limit: 2Gi
    roleGroups:
      default:
        # NOTE: In order to properly show ArgoCD in action - syncing changes via Git - do the following:
        # - Fork this repository
        # - Use the demo parameters `customGitUrl` and `customGitBranch` to point the
        #   the repository to your fork and branch
        # - Change the replicas here and push that to the provided `customGitBranch` in your fork
        replicas: 1
  kubernetesExecutors:
    envOverrides: *envOverrides
    podOverrides:
      spec:
        containers:
          - name: base
            env:
              - name: AIRFLOW_CONN_S3
                valueFrom:
                  secretKeyRef:
                    name: airflow-s3-connection
                    key: airflow-s3-connection
        initContainers:
          - name: git-sync-0-init
            resources:
              limits:
                memory: "128Mi"
              requests:
                memory: "128Mi"
  schedulers:
    envOverrides: *envOverrides
    podOverrides: *podOverrides
    config:
      gracefulShutdownTimeout: 30s
      resources:
        cpu:
          min: 400m
          max: "1"
        memory:
          limit: 1Gi
    roleGroups:
      default:
        replicas: 1
