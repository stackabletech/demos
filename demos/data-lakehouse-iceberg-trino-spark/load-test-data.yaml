---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-data
spec:
  template:
    spec:
      containers:
        - name: load-test-data
          image: docker.io/rclone/rclone:1.75.1
          command:
            - /bin/sh
            - -euo
            - pipefail
            - -c
            - |
              # This job needs both the public CAs to download the datasets over
              # HTTPS, and the secret-operator CA to verify Garage.
              cat /etc/ssl/certs/ca-certificates.crt /stackable/tls/ca.crt > /tmp/ca-bundle.crt

              BASE=https://repo.stackable.tech/repository/misc

              load() {
                rclone copyurl "$1" "$2"
              }

              # Please try to order the load jobs from small to large datasets
              load "$BASE/datasets/open-postcode-geo/open-postcode-geo.csv" \
                   :s3:staging/house-sales/postcode-geo-lookup/open-postcode-geo.csv

              for year in $(seq 2005 2021); do
                file="uk-house-sales-$year.csv"
                load "$BASE/datasets/uk-house-sales/$file" \
                     ":s3:staging/house-sales/house-sales/$file"
              done

              load "$BASE/earthquake-data/earthquakes_1950_to_2022.csv" \
                   :s3:staging/earthquakes/earthquakes/earthquakes_1950_to_2022.csv

              load "$BASE/datasets/e-charging-stations/e-charging-stations-2022-08.csv" \
                   :s3:staging/smart-city/e-charging-stations/e-charging-stations-2022-08.csv

              load "$BASE/ny-taxi-data/taxi_zone_lookup.csv" \
                   :s3:staging/taxi/taxi-zone-lookup/taxi_zone_lookup.csv

              load "$BASE/ny-taxi-data/rate_code_lookup.csv" \
                   :s3:staging/taxi/rate-code-lookup/rate_code_lookup.csv

              load "$BASE/ny-taxi-data/payment_type_lookup.csv" \
                   :s3:staging/taxi/payment-type-lookup/payment_type_lookup.csv

              for month in 2021-01 2021-02 2021-03 2021-04 2021-05 2021-06 \
                           2021-07 2021-08 2021-09 2021-10 2021-11 2021-12 \
                           2022-01 2022-02 2022-03 2022-04 2022-05 2022-06; do
                file="green_tripdata_$month.parquet"
                load "$BASE/ny-taxi-data/$file" ":s3:staging/taxi/green-tripdata/$file"
              done

              for month in 2015-01 2015-02 2015-03 2015-04 2015-05 2015-06 \
                           2015-07 2015-08 2015-09 2015-10 2015-11 2015-12 \
                           2016-01 2016-02 2016-03 2016-04 2016-05 2016-06 \
                           2016-07 2016-08 2016-09 2016-10 2016-11 2016-12 \
                           2017-01 2017-02 2017-03 2017-04 2017-05 2017-06 \
                           2017-07 2017-08 2017-09 2017-10 2017-11 2017-12 \
                           2018-01 2018-02 2018-03 2018-04 2018-05 2018-06 \
                           2018-07 2018-08 2018-09 2018-10 2018-11 2018-12 \
                           2019-01 2019-02 2019-03 2019-04 2019-05 2019-06 \
                           2019-07 2019-08 2019-09 2019-10 2019-11 2019-12 \
                           2020-01 2020-02 2020-03 2020-04 2020-05 2020-06 \
                           2020-07 2020-08 2020-09 2020-10 2020-11 2020-12 \
                           2021-01 2021-02 2021-03 2021-04 2021-05 2021-06 \
                           2021-07 2021-08 2021-09 2021-10 2021-11 2021-12 \
                           2022-01 2022-02 2022-03 2022-04 2022-05 2022-06 \
                           2022-07 2022-08 2022-09 2022-10 2022-11 2022-12 \
                           2023-01 2023-02 2023-03 2023-04; do
                file="yellow_tripdata_$month.parquet"
                load "$BASE/ny-taxi-data/$file" ":s3:staging/taxi/yellow-tripdata/$file"
              done

              for month in 2020-09 2020-10 2020-11 2020-12 \
                           2021-01 2021-02 2021-03 2021-04 2021-05 2021-06 \
                           2021-07 2021-08 2021-09 2021-10 2021-11 2021-12 \
                           2022-01 2022-02 2022-03 2022-04 2022-05 2022-06; do
                file="fhvhv_tripdata_$month.parquet"
                load "$BASE/ny-taxi-data/$file" ":s3:staging/taxi/fhvhv-tripdata/$file"
              done
          env:
            # No config file, everything is configured through the environment.
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_S3_PROVIDER
              value: Other
            - name: RCLONE_S3_ENDPOINT
              value: https://garage.{{ NAMESPACE }}.svc.cluster.local:9000
            # Garage rejects requests signed for a different region.
            - name: RCLONE_S3_REGION
              value: region-1
            # Garage only serves path style, not virtual-hosted style.
            - name: RCLONE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CA_CERT
              value: /tmp/ca-bundle.crt
            # Buckets are created by the Garage init job. Without this rclone
            # creates a missing bucket on the fly, which turns a typo into a
            # silent success instead of an error.
            - name: RCLONE_S3_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: accessKey
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secretKey
          volumeMounts:
            - name: tls
              mountPath: /stackable/tls
      volumes:
        # Request the CA cert from the secret-operator to verify the certificate
        # served in front of Garage
        - name: tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: tls
                  secrets.stackable.tech/provision-parts: public
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    # The secret-operator projects certificates rather than
                    # provisioning a disk, so it ignores this. The API server
                    # still requires the field and rejects a non-positive value,
                    # hence the placeholder.
                    storage: "1"
      restartPolicy: OnFailure
  backoffLimit: 50
