---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-ny-taxi-data
spec:
  template:
    spec:
      containers:
        - name: load-ny-taxi-data
          image: docker.io/rclone/rclone:1.75.1
          command:
            - /bin/sh
            - -euo
            - pipefail
            - -c
            - |
              BASE=https://repo.stackable.tech/repository/misc/ny-taxi-data

              for month in \
                2020-01 2020-02 2020-03 2020-04 2020-05 2020-06 2020-07 2020-08 2020-09 2020-10 \
                2020-11 2020-12 2021-01 2021-02 2021-03 2021-04 2021-05 2021-06 2021-07 2021-08 \
                2021-09 2021-10 2021-11 2021-12 2022-01 2022-02 2022-03 2022-04; do
                file="yellow_tripdata_$month.parquet"
                # copyurl streams the download straight into S3, no temp file
                rclone copyurl "$BASE/$file" ":s3:demo/ny-taxi-data/raw/$file"
              done
          env:
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_S3_PROVIDER
              value: Other
            - name: RCLONE_S3_ENDPOINT
              value: https://garage.{{ NAMESPACE }}.svc.cluster.local:9000
            - name: RCLONE_S3_REGION
              value: region-1
            # Garage only serves path style, not virtual-hosted style.
            - name: RCLONE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CA_CERT
              value: /stackable/tls/ca.crt
            # Buckets are created by the Garage init job. Without this rclone
            # creates a missing bucket on the fly, which turns a typo into a
            # silent success instead of an error.
            - name: RCLONE_S3_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: accessKey
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secretKey
          volumeMounts:
            - name: tls
              mountPath: /stackable/tls
      volumes:
        - name: tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: tls
                  secrets.stackable.tech/scope: service=garage,pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: "1"
      restartPolicy: OnFailure
  backoffLimit: 50
