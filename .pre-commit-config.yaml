---
default_language_version:
  node: system

exclude: '(stacks/_templates/minio-.*/rendered-chart\.yaml|\.svg)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # 4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
        exclude: '^stacks/argo-cd-git-ops/secrets/sealed-secrets-key\.yaml$'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1 # 1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0 # 0.41.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0 # 0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=info"]

  - repo: https://github.com/rhysd/actionlint
    rev: e7d448ef7507c20fc4c88a95d0c448b848cd6127 # 1.7.8
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--min-confidence", "medium"]
