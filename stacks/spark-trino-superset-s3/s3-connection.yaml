---
apiVersion: s3.stackable.tech/v1alpha1
kind: S3Connection
metadata:
  name: garage
spec:
  host: garage.{{ NAMESPACE }}.svc.cluster.local
  port: 9000
  # Must match s3_region in stacks/_templates/garage.yaml: Garage rejects
  # requests signed for a different region. Deliberately not an AWS region:
  # the Hadoop S3 implementation falls back to us-east-2 when none is set.
  region:
    name: region-1
  accessStyle: Path
  credentials:
    secretClass: s3-credentials
  tls:
    verification:
      server:
        caCert:
          secretClass: tls
---
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: s3-credentials
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  labels:
    secrets.stackable.tech/class: s3-credentials
stringData:
  accessKey: GK31c0ffee31c0ffee31c0ffee
  secretKey: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
