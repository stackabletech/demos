---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaCluster
metadata:
  name: kafka
spec:
  image:
    productVersion: 4.3.1
  clusterConfig:
    tls:
      serverSecretClass: tls
  controllers:
    roleGroups:
      default:
        replicas: 1
  brokers:
    config:
      bootstrapListenerClass: cluster-internal
      brokerListenerClass: cluster-internal
    podOverrides:
        spec:
          containers:
            - name: kafka
              env:
              - name: BOOTSTRAP_SERVER
                valueFrom:
                  configMapKeyRef:
                    name: kafka
                    key: KAFKA
    roleGroups:
      default:
        replicas: 1
