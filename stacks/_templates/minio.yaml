---
releaseName: minio
name: minio
repo:
  name: bitnami
  url: https://charts.bitnami.com/bitnami/
version: 12.6.4 # appVersion: 2023.5.18
options:
  commonLabels:
    stackable.tech/vendor: Stackable
    stackable.tech/stack: "{{ STACK }}"
    # The following is a Jinja2 template directive, not a regular comment.
    # The `#` prefix is required to prevent YAML parsing errors, but Jinja2 still processes it.
    # {% if DEMO is defined %}
    stackable.tech/demo: "{{ DEMO }}"
    # {% endif %}
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  mode: standalone
  auth:
    rootUser: admin
    rootPassword: "{{ minioAdminPassword }}"
  defaultBuckets: demo:public
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 1
      memory: 2Gi
  service:
    type: NodePort
