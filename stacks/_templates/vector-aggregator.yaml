---
releaseName: vector-aggregator
name: vector
repo:
  name: vector
  url: https://helm.vector.dev
version: 0.58.0 # app version 0.58.0
options:
  commonLabels:
    stackable.tech/vendor: Stackable
    stackable.tech/stack: "{{ STACK }}"
    # The following is a Jinja2 template directive, not a regular comment.
    # The `#` prefix is required to prevent YAML parsing errors, but Jinja2 still processes it.
    # {% if DEMO is defined %}
    stackable.tech/demo: "{{ DEMO }}"
    # {% endif %}
  podLabels:
    stackable.tech/vendor: Stackable
    stackable.tech/stack: "{{ STACK }}"
    # The following is a Jinja2 template directive, not a regular comment.
    # The `#` prefix is required to prevent YAML parsing errors, but Jinja2 still processes it.
    # {% if DEMO is defined %}
    stackable.tech/demo: "{{ DEMO }}"
    # {% endif %}
  role: Aggregator
  args:
    - --config-dir
    - "/etc/vector/"
    - --dangerously-allow-env-var-interpolation
  customConfig:
    sources:
      vector:
        address: 0.0.0.0:6000
        type: vector
        version: "2"
    sinks:
      opensearch:
        type: elasticsearch
        inputs:
          - vector
        endpoints:
          - $OPENSEARCH_HOSTS
        # Write to data streams instead of plain indices.
        mode: data_stream
        # The auto-detection of the API version does not work in Vector
        # 0.41.1 for OpenSearch, so the version must be set explicitly
        # (see https://github.com/vectordotdev/vector/issues/17690).
        api_version: v8
        tls:
          # Add the certificate of the Certificate Authority
          # generated by the secret-operator so that the
          # OpenSearch service can be verified
          ca_file: /certs/ca.crt
        auth:
          strategy: basic
          user: admin
          password: $OPEN_SEARCH_ADMIN_PASSWORD
  serviceAccount:
    create: false
    # Use the ServiceAccount of OpenSearch because its permissions are already configured to work
    # on OpenShift.
    name: opensearch-serviceaccount
  initContainers:
    # Wait for the index template which makes OpenSearch store the log data in data streams.
    # If Vector wrote log events before this index template existed, then OpenSearch would
    # create plain indices instead of data streams.
    - name: wait-for-index-template
      image: oci.stackable.tech/sdp/testing-tools:0.3.0-stackable0.0.0-dev
      env:
        - name: OPENSEARCH_HOSTS
          valueFrom:
            configMapKeyRef:
              name: opensearch
              key: OPENSEARCH_HOSTS
        - name: OPEN_SEARCH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-user
              key: password
      volumeMounts:
        - name: tls
          mountPath: /certs
      command:
        - bash
        - -euo
        - pipefail
        - -c
        - |
          #!/bin/bash
          until curl \
              --fail \
              --silent \
              --show-error \
              --cacert /certs/ca.crt \
              --user "admin:${OPEN_SEARCH_ADMIN_PASSWORD}" \
              --output /dev/null \
              "${OPENSEARCH_HOSTS}/_index_template/logs"; do
              echo 'Waiting for the index template "logs" to be created...'
              sleep 5
          done
  env:
    - name: OPEN_SEARCH_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-user
          key: password
  envFrom:
    - configMapRef:
        name: opensearch
  extraVolumeMounts:
    - name: tls
      mountPath: /certs
  extraVolumes:
    - name: tls
      configMap:
        name: truststore-pem
