---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaCluster
metadata:
  name: kafka
spec:
  image:
    productVersion: 4.3.1
  clusterConfig:
    authentication:
      - authenticationClass: kafka-client-tls
    managementAccess:
      enabled: true
      authentication:
        userProvided: # TODO: Switch to automatic once supported
          tls:
            secretClassName: tls
  controllers:
    configOverrides:
      controller.properties: &sharedProperties
        # We want to create the Topics using the KafkaTopic CRD
        auto.create.topics.enable: "false"
        num.partitions: "32"
        log.segment.bytes: "50000000" # 50 MB
        log.retention.bytes: "2000000000" # 2 GB. Should keep between 2.0 and 2.5GB
    roleGroups:
      default:
        replicas: 1
  brokers:
    config:
      bootstrapListenerClass: external-stable
      brokerListenerClass: external-unstable
      resources:
        storage:
          logDirs:
            capacity: 50Gi
        cpu:
          min: "1500m"
          max: "3"
        memory:
          limit: 2Gi
    configOverrides:
      broker.properties: *sharedProperties
    roleGroups:
      default:
        replicas: 5
---
apiVersion: authentication.stackable.tech/v1alpha1
kind: AuthenticationClass
metadata:
  name: kafka-client-tls
spec:
  provider:
    tls:
      clientCertSecretClass: tls
