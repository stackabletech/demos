---
apiVersion: druid.stackable.tech/v1alpha1
kind: DruidCluster
metadata:
  name: druid
spec:
  image:
    productVersion: 37.0.0
  clusterConfig:
    zookeeperConfigMapName: druid-znode
    metadataDatabase:
      postgresql:
        host: postgresql-druid
        database: druid
        credentialsSecretName: druid-db-credentials
    deepStorage:
      s3:
        bucket:
          inline:
            bucketName: demo
            connection:
              inline:
                host: garage.{{ NAMESPACE }}.svc.cluster.local
                port: 9000
                # Must match s3_region in stacks/_templates/garage.yaml: Garage
                # rejects requests signed for a different region.
                # Only honoured for Druid >= 37.0.0, which uses the AWS SDK v2.
                # Older versions use SDK v1, which ignores the region when an
                # endpoint is set.
                region:
                  name: region-1
                accessStyle: Path
                credentials:
                  secretClass: druid-s3-credentials
                tls:
                  verification:
                    server:
                      caCert:
                        secretClass: tls
        baseKey: data
  brokers:
    roleConfig:
      listenerClass: external-stable
    configOverrides: &configOverrides
      runtime.properties:
        druid.server.http.enforceStrictSNIHostChecking: "false"
    roleGroups:
      default:
        replicas: 1
  coordinators:
    roleConfig:
      listenerClass: external-stable
    configOverrides: *configOverrides
    roleGroups:
      default:
        replicas: 1
  historicals:
    config:
      resources:
        cpu:
          min: "1"
          max: "2"
        memory:
          limit: 4Gi
        storage:
          segmentCache:
            emptyDir:
              capacity: 8Gi
    configOverrides: *configOverrides
    roleGroups:
      default:
        replicas: 2
  middleManagers:
    config:
      resources:
        cpu:
          min: "1"
          max: "4" # Need enough CPU cores to run multiple ingestion jobs at once
        memory:
          limit: 16Gi
    roleGroups:
      default:
        replicas: 1
    configOverrides: *configOverrides
  routers:
    roleConfig:
      listenerClass: external-stable
    configOverrides: *configOverrides
    roleGroups:
      default:
        replicas: 1
---
apiVersion: zookeeper.stackable.tech/v1alpha1
kind: ZookeeperZnode
metadata:
  name: druid-znode
spec:
  clusterRef:
    name: zookeeper
---
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: druid-s3-credentials
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: druid-s3-credentials
  labels:
    secrets.stackable.tech/class: druid-s3-credentials
stringData:
  accessKey: GK31c0ffee31c0ffee31c0ffee
  secretKey: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
---
apiVersion: v1
kind: Secret
metadata:
  name: druid-db-credentials
stringData:
  username: druid
  password: druid
